[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spending-analyzer"
version = "0.1.0"
description = "Privacy-first personal spending analyzer for bank statement PDFs"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "reportlab>=4",
    "anthropic>=1.12",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
